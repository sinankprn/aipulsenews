<div id="author-follow-cta" class="author-follow-cta" role="complementary" aria-label="Follow the author">
  <div class="author-follow-content">
    <div class="author-follow-text">
      <strong>Enjoyed this analysis?</strong>
      <span>Follow {{ site.author.name }} for more AI insights</span>
    </div>
    <div class="author-follow-buttons">
      <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" target="_blank" rel="noopener" class="follow-btn follow-btn--linkedin">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        LinkedIn
      </a>
      <a href="{{ site.author.url }}" target="_blank" rel="noopener" class="follow-btn follow-btn--website">
        sinankprn.com
      </a>
    </div>
    <button class="author-follow-dismiss" aria-label="Dismiss" onclick="dismissAuthorCta()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</div>

<script>
(function() {
  var cta = document.getElementById('author-follow-cta');
  if (!cta) return;

  var STORAGE_KEY = 'author-follow-dismissed';
  var dismissed = localStorage.getItem(STORAGE_KEY);

  // Don't show if dismissed in last 7 days
  if (dismissed && (Date.now() - parseInt(dismissed, 10)) < 7 * 24 * 60 * 60 * 1000) {
    cta.remove();
    return;
  }

  function getScrollPercent() {
    var docHeight = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
    var winHeight = window.innerHeight;
    var scrollTop = window.scrollY || document.documentElement.scrollTop;
    var scrollable = docHeight - winHeight;
    if (scrollable <= 0) return 0;
    return (scrollTop / scrollable) * 100;
  }

  var shown = false;
  var ticking = false;
  window.addEventListener('scroll', function() {
    if (!ticking) {
      requestAnimationFrame(function() {
        if (!shown && getScrollPercent() >= 65) {
          cta.classList.add('visible');
          shown = true;
        }
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });
})();

function dismissAuthorCta() {
  var cta = document.getElementById('author-follow-cta');
  if (cta) {
    cta.classList.remove('visible');
    localStorage.setItem('author-follow-dismissed', Date.now().toString());
    setTimeout(function() { cta.remove(); }, 300);
  }
}
</script>

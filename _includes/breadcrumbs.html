<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    <li><a href="{{ '/' | relative_url }}">Home</a></li>
    {% if page.tags.size > 0 %}
    <li><a href="{{ '/tags/' | append: page.tags.first | slugify | append: '/' | relative_url }}">{{ page.tags.first }}</a></li>
    {% endif %}
    <li aria-current="page">{{ page.title | truncatewords: 8 }}</li>
  </ol>
</nav>

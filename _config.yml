# Site Settings
title: "AI Pulse"
description: "Daily AI news, breakthroughs, and insights curated for humans"
url: "https://artificialintelligencepulse.it.com"
baseurl: ""
lang: en

# Author
author:
  name: "AI Pulse Staff"
  bio: "Editorial team covering AI news and research"
  full_bio: "AI Pulse Staff is the editorial team behind AI Pulse, covering daily developments in artificial intelligence, machine learning, and LLMs."

# SEO Keywords
keywords:
  - artificial intelligence news
  - AI breakthroughs
  - LLM news
  - AI trends 2026
  - machine learning updates
enable_search_action: true

# Build Settings
markdown: kramdown
permalink: /:year/:month/:day/:title/
future: true
excerpt_separator: "<!--more-->"

# Kramdown settings for TOC
kramdown:
  toc_levels: 2..3
  auto_ids: true

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate-v2

# Pagination
pagination:
  enabled: true
  per_page: 12
  permalink: "/page/:num/"
  sort_reverse: true

# SEO Defaults
logo: /assets/images/icons/web-app-manifest-512x512.png
image: /assets/images/icons/web-app-manifest-512x512.png
twitter:
  card: summary_large_image

# Social Links
social:

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "AI Pulse Staff"

# Google AdSense
# Replace with your AdSense publisher ID (ca-pub-XXXXXXXXXXXXXXXX)
adsense:
  enabled: false
  publisher_id: "ca-pub-5814690967626535"

# Newsletter popup
newsletter:
  popup_enabled: false

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - scripts/
  - _content-queue/
  - README.md
  - "*.py"
